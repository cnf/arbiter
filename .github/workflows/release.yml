name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    strategy:
      matrix:
        # When enabling docker builds, make sure to also update the docker buildx platforms in the publish-container job.
        include:
          - goos: linux
            goarch: amd64
            docker: true
          - goos: linux
            goarch: arm64
            docker: true
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      # Manual (workflow_dispatch) runs publish the :develop image only.
      TAG: ${{ github.event.release.tag_name || 'develop' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        run: |
          name="arbiter-${{ matrix.goos }}-${{ matrix.goarch }}"
          pkg="dist/${name}"
          mkdir -p "${pkg}"

          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi

          go build -o "${pkg}/arbiter${ext}" ./cmd/arbiter
          go build -o "${pkg}/catalog-convert${ext}" ./cmd/catalog-convert
          cp arbiter.example.yaml "${pkg}/"

          (cd dist && zip -r "${name}.zip" "${name}")

      - uses: docker/setup-qemu-action@v3
        if: matrix.docker == true

      - uses: docker/setup-buildx-action@v3
        if: matrix.docker == true

      - name: Log in to GitHub Container Registry
        if: matrix.docker == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish architecture image
        if: matrix.docker == true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.release
          platforms: linux/${{ matrix.goarch }}
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.TAG }}-${{ matrix.goarch }}

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  publish-container:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name || 'develop' }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch release tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ env.TAG }}
          EVENT: ${{ github.event_name }}
        run: |
          tags=(--tag "${IMAGE_NAME}:${RELEASE_TAG}")
          if [ "${EVENT}" = "release" ]; then
            tags+=(--tag "${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "${IMAGE_NAME}:${RELEASE_TAG}-arm64"
