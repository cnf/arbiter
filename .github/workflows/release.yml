name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        run: |
          name="arbiter-${{ matrix.goos }}-${{ matrix.goarch }}"
          pkg="dist/${name}"
          mkdir -p "${pkg}"

          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi

          go build -o "${pkg}/arbiter${ext}" ./cmd/arbiter
          go build -o "${pkg}/catalog-convert${ext}" ./cmd/catalog-convert
          cp arbiter.example.yaml "${pkg}/"

          (cd dist && zip -r "${name}.zip" "${name}")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
