version: "1.0"

providers:
  mockllm:
    type: "openai"
    endpoint: "http://localhost:5665/v1"
    models: ["mock-llm"]
  litellm:
    type: "openai"
    endpoint: "${LITELLM_URL}"
    key: "${LITELLM_API_KEY}"
    models: ["openrouter/free"]

  claude:
    type: "anthropic"
    endpoint: "https://api.anthropic.com"
    key: "${ANTHROPIC_API_KEY}"
    models:
      - "claude-3-opus-20250219"
      - "claude-3-sonnet-20250219"
      - "claude-3-haiku-20250307"
      - "claude-hal"

  gpt4:
    type: "openai"
    endpoint: "https://api.openai.com/v1"
    key: "${OPENAI_API_KEY}"
    models:
      - "gpt-4-turbo"
      - "gpt-4o"

  local:
    # Ollama exposes an OpenAI-compatible /v1 endpoint. "ollama" selects
    # that OpenAI-compatible transport while preserving provider identity.
    type: "ollama"
    endpoint: "http://localhost:11434/v1"
    models:
      - "llama2"

# Each classifier fills exactly one axis of the routing signals, declared via
# `axis` (domain | effort | cost_class | capabilities). Several instances of
# the same "heuristic" type run side by side and are merged per axis, so a
# high-confidence domain match can't starve the effort axis. `axis` may be
# omitted on a "heuristic" classifier (defaults to domain, matching older
# configs); the legacy "capability_detector" type always fills capabilities.
#
# `only_if_unset` (classifier-level, not inside `config:`) gates a model-backed
# classifier: when true, the classifier is skipped — no upstream call, no cost —
# unless its axis is still empty after every classifier declared before it. This
# is the "expensive call runs only when the cheap ones said nothing" shape:
# declare a heuristic first (always runs, merge decides), then the llm/decisions
# classifier with only_if_unset, and the model call fires only when the
# heuristic didn't fill the axis (including an escape/"other" verdict, which
# fills nothing). Only "llm"/"decisions" may set it; the merge skip is per-axis,
# so an only_if_unset domain classifier still runs when only the effort axis
# was filled elsewhere.
#
# A `type: "llm"` classifier asks an upstream model to classify instead of
# matching keywords. Its `config:` takes:
#   alias/model:  exactly one — where the classification call goes.
#     alias:      a configured alias (resolved like any client-named alias, so
#                 a group alias's fallback siblings apply to it too).
#     model:      a declared provider model name ("provider/model"), addressed
#                 directly with no alias at all — the form a classifier uses
#                 when it is itself reached as a fallback from another
#                 classifier, where a client-facing alias would be wrong.
#   labels:       required — either a list of bare names, or a map of
#                 name -> description. The description is the category's
#                 BOUNDARY and is the single biggest lever on accuracy: a bare
#                 "code_generation" tells the model nothing about where it ends
#                 and "reasoning" begins. Both shapes may be mixed in one list.
#   escape:       optional — the label name meaning "none of these apply". Its
#                 verdict fills NO axis, so a policy router's rules simply don't
#                 match and a chained router takes over. Without one, "nothing
#                 fits" can only be a wrong label or an off-list reply, and an
#                 off-list reply counts as a FAILURE that falls back.
#   instructions: optional — replaces the default framing sentence. The
#                 single-word reply contract is always appended and is not
#                 configurable.
#   fallback:     required — another (non-llm) classifier to defer to whenever
#                 the call fails outright.
#   timeout:      optional — Go duration, defaults to 10s.
#   max_input_chars: optional — caps the classified text in characters
#                 (default 8192, ~2K tokens at the char/4 heuristic this repo
#                 documents). The cap truncates the tail and marks the cut. A
#                 negative value means unlimited, asked for explicitly; 0 is a
#                 load error, because it would read as "unset" and take the
#                 default while the operator believed they had set a cap.
#                 Unset meaning "unlimited" is not offered: an uncapped input
#                 sent a 111KB turn that the upstream rejected outright.
#
# A `type: "decisions"` classifier asks a decision model (TypeSafe's System One
# / Jev) typed questions instead of asking a chat model for one word. Nothing is
# parsed, so an off-list answer is impossible, and every answer carries a real
# probability. Its `config:` takes:
#   alias/model:  exactly one — where the decision call goes. Same two forms as
#                 an llm classifier's, but the target must resolve to a provider
#                 of type "decisions" (a chat provider here is a load error).
#   question:     required — the typed questions it asks, ALL in ONE call:
#     <name>:
#                   axis:         which Signals axis it fills (required; two
#                                 questions may not share an axis)
#                   type:         "choice" (the only primitive built so far)
#                   labels:       the option set, same shapes as `labels:` above
#                   escape:       optional — names the label meaning "no option
#                                 fits". It is sent under ITS OWN NAME (it is
#                                 already one of `labels`), and choosing it fills
#                                 no axis. With no escape configured, an `other`
#                                 option is added instead.
#                   instructions: optional — what is being decided between them
#                 Each answer's probability becomes that axis's confidence
#                 (Signals.AxisConfidence), so the merge scores every axis on
#                 its own number rather than on one figure for the whole call.
#   fallback:     required — another classifier; MAY name an `llm` one, unlike
#                 an llm classifier's own fallback (a chat model is the natural
#                 escalation for a failed decision call).
#   timeout:      optional — Go duration, defaults to 10s.
#   max_input_chars: optional — same meaning as on an `llm` classifier above.
#
# Every call is recorded as its own kind="classifier" row. With capture_content
# on, that row also carries the text it classified and the prompt it was given,
# so a wrong verdict can be read against what produced it.
#
# ANY classifier type may also take a `match:` block, which matches the
# request's OWN text rather than its last user message — the text that
# identifies a request is not always in the user's message (a title generator's
# signature is in its system prompt, and its last user message is the
# conversation being titled):
#   match:        required for the block — a pattern, a list of patterns, or
#                 {mode, pattern}. Patterns are OR-ed.
#     mode:       exact | prefix | regex (default prefix). Same vocabulary and
#                 the same code as the prompt_rewrite guardrail's.
#     pattern:    the text to look for.
#   value:        the axis value a hit fills. One of value/kind is required.
#   kind:         the request KIND a hit records — "title", later "subagent".
#                 Not an axis: it is what the request IS, not what it is about,
#                 so it carries no confidence, no force-alias can target it, and
#                 a kind-only matcher (no `value`) fills no axis at all. That is
#                 the normal shape for a signature like a title generator's,
#                 whose "domain" has no meaningful answer.
#   where:        system | messages | all (default system).
#   decisive:     optional bool — a HIT ends classification, so classifiers
#                 declared after this one do not run. A MISS falls through
#                 normally.
#
# A `kind:` signature is what makes an internal-looking request identifiable on
# its row without changing where it routes. It also bounds the cost: declared
# first and decisive, it skips every model-backed classifier behind it, so an
# identified request pays for no classification call at all.
#
# classifiers:
#   - name: "request-kind"
#     type: "heuristic"
#     config:
#       match:
#         - mode: "prefix"
#           pattern: "You name chat sessions."
#       kind: "title"
#       decisive: true
#
# A `capability_detector` may take `detect:`, which proves capabilities from the
# request's shape rather than from its words:
#   detect:               tool_use | attachment | long_context
#   long_context_tokens:  required when long_context is detected — without a
#                         threshold it could never fire.
# Keywords still work alongside it, for what shape cannot prove.
#
# classifiers:
#   - name: "domain-heuristic"
#     type: "heuristic"
#     config:
#       keywords: { code_generation: ["write", "refactor"] }
#   - name: "domain-llm"
#     type: "llm"
#     axis: "domain"
#     only_if_unset: true          # run only when the heuristic left domain empty
#     config:
#       alias: "cheap-claude"      # or model: "claude/claude-3-haiku-20250307"
#       labels:
#         code_generation: >-
#           the user wants code written, modified, refactored, or reviewed —
#           an implementation task with a concrete code artifact as the answer.
#         reasoning: >-
#           the user wants something explained, analyzed or debugged — an
#           answer in prose, with no code artifact as the deliverable.
#         chat: "greeting or small talk with no artifact expected."
#         none: "none of the other categories apply."
#       escape: "none"
#       fallback: "domain-heuristic"
classifiers:
  # A title-generating request is one the client sends to name a session, not a
  # turn of the conversation. It has no meaningful `domain`, so a hit fills no
  # axis — it records `kind: "title"`, which is what makes the request
  # identifiable on its row.
  #
  # Declared first and decisive, so an identified title call skips every
  # model-backed classifier behind it and pays for no classification call at all.
  # That is the whole cost win: a title call never pins to a session (its session
  # key hashes the conversation being titled, which differs every call), so
  # without this it would classify on every single call.
  #
  # The three patterns below are written against the clients' REAL prompts, read
  # out of the live store (79 distinct system prompts, all three verified to hit
  # their own prompt and nothing else). Two hazards worth knowing:
  #
  #   - `prefix` mode requires the text to START with the pattern, and Claude's
  #     title instruction does not: its system prompt opens with an
  #     `x-anthropic-billing-header:` line and "You are Claude Code...", with the
  #     instruction buried ~165 bytes in. So `regex` is used for all three.
  #   - regex is case-sensitive (unlike exact/prefix), hence the explicit `(?i)`.
  #     A loose pattern here is silent and dangerous: `(?i)title` alone matches
  #     50 of the 79 prompts, because every Hermes prompt contains the phrase
  #     "title-generation grouping in the UI is deferred" in its memory text.
  - name: "request-kind"
    type: "heuristic"
    config:
      match:
        # Hermes — "You name chat sessions. Given the user's opening message..."
        - mode: "regex"
          pattern: "(?i)^\\s*You name chat sessions\\."
        # opencode — "You are a title generator. You output ONLY a thread title."
        # Note it says "thread title", which is why a pattern written against the
        # word "title" alone is both too loose and easy to get wrong.
        - mode: "regex"
          pattern: "(?i)^\\s*You are a title generator\\."
        # Claude Code CLI — "Generate a concise, sentence-case title (3-7 words)".
        # Buried in the system prompt, so anchored on the instruction itself
        # rather than on the start of the block.
        - mode: "regex"
          pattern: "(?i)Generate a concise, sentence-case title"
      kind: "title"
      decisive: true

  - name: "domain"
    type: "heuristic"
    axis: "domain"
    config:
      keywords:
        code_generation:
          - "write"
          - "generate"
          - "refactor"
          - "implement"
        reasoning:
          - "explain"
          - "analyze"
          - "debug"
          - "understand"
        chat:
          - "hello"
          - "hi"
          - "hey"
        discovery:
          - "what is"
          - "how does"
          - "when did"

  - name: "effort"
    type: "heuristic"
    axis: "effort"
    config:
      keywords:
        easy:
          - "quick"
          - "simple"
          - "one-liner"
        medium:
          - "implement"
          - "write"
        hard:
          - "architecture"
          - "design"
          - "debug this"
          - "complex"

  - name: "capability"
    type: "capability_detector"
    config:
      detectors:
        vision:
          - "image"
          - "screenshot"
          - "visual"
        tool_use:
          - "tool"
          - "function"
          - "action"

# Virtual model aliases. A client names one in the request's `model` field.
# Three shapes:
#   - force:      overrides only the axes it lists, then rules decide; an
#                 empty `force: {}` is the "full auto" alias (classify +
#                 rules, no axis locked in).
#   - pinned:     names one concrete provider/model.
#   - group:      an ordered candidate set; the selected member is the
#                 primary and the rest are its fallback chain.
aliases:
  auto:
    force: {}                      # full auto: no axis forced
  coding:
    force: { domain: ["code_generation"] }
  coding-hard:
    force: { domain: ["code_generation"], effort: ["hard"] }

  cheap-claude:
    type: "pinned"
    provider: "claude"
    model: "claude-3-haiku-20250307"

  free-search:
    type: "group"
    select: "random"               # random | cheapest_input | cheapest_output | fastest
    members:
      - { provider: "litellm", model: "openrouter/free" }
      - { provider: "local", model: "llama2" }

# Static cost/latency catalog for the cost- and latency-aware group `select:`
# strategies. Costs are USD per million tokens; latency is a p50 estimate in
# ms. A provider/model with no entry is treated as unknown cost and ranks
# last — it does not error. Provider must be configured and model must be one
# of its declared models. Duplicate provider/model rows are an error.
#
# `model_catalog_file:` names a second catalog file (usually a generated
# artifact; see the catalog converter tool), read relative to this file's
# directory. Rows there are DEFAULTS: an inline row for the same
# provider/model replaces the file's row entirely. Writes to that file do NOT
# trigger a config reload — the watcher only tracks this file — so a
# regenerated catalog needs an explicit reload.
#
# model_catalog_file: "catalog.yaml"
#
# model_catalog:
#   - provider: "litellm"
#     model: "openrouter/free"
#     input_cost_per_mtok: 0
#     output_cost_per_mtok: 0
#     latency_ms_p50: 2500
#   - provider: "claude"
#     model: "claude-3-haiku-20250307"
#     input_cost_per_mtok: 0.25
#     output_cost_per_mtok: 1.25
#     latency_ms_p50: 900

routers:
  - name: "primary"
    type: "simple"
    config:
      default_provider: "mockllm"
#  - name: "primary"
#    type: "simple"
#    config:
#      default_provider: "claude"
#      fallback_provider: "gpt4"

# A "policy" router matches classifier signals against ordered rules — first
# match wins — and errors if nothing matches. Chain it ahead of a "simple"
# router so unmatched requests fall through to a default instead of failing.
# A rule's target is either `target:` (an alias name) or `provider:`/`model:`
# (a literal provider/model) — not both. `when` keys are domain, effort,
# cost_class, and capabilities; the deprecated spellings `intent` and
# `cost_sensitivity` are still accepted (but not alongside their replacement
# on the same rule).
#
#  - name: "policy"
#    type: "policy"
#    config:
#      rules:
#        - when: { domain: "code_generation", effort: "hard" }
#          target: "cheap-claude"
#        - when: { domain: "code_generation", effort: "easy" }
#          target: "free-search"
#        - when: { capabilities: ["vision"] }
#          provider: "gpt4"
#        - when: { cost_class: "budget" }
#          provider: "local"
#  - name: "primary"
#    type: "simple"
#    config:
#      default_provider: "claude"
#      fallback_provider: "gpt4"

# Failure-triggered fallbacks: when the routed provider fails with 429/5xx,
# these providers are tried in order (each once). A 429 records a cooldown
# (from the upstream's Retry-After header, else 5s) during which the
# provider is skipped entirely — logged as upstream_cooldown.
#
# routing:
#   fallback_providers: ["gpt4", "litellm"]

# Admin surface (/admin/*). All of it is read-only except POST /admin/reload,
# which re-reads this file AND the model_catalog_file on demand — the latter
# is inert on write, so a regenerated catalog needs this call.
#   POST /admin/reload            reload config + catalog
#   GET  /admin/stats*            aggregates: overall, providers, epochs,
#                                 session, tools
#   GET  /admin/requests[/{id}]   the request rows themselves, and one in full
#                                 (with captured content, when enabled below)
#   GET  /admin/content/repeated  blocks recurring across requests — how
#                                 client-injected boilerplate is detected
#
# Arbiter implements no auth: Caddy (forward_auth) and the network do that.
# The one in-app affordance is `forward_auth_header`: when set, an /admin/*
# request lacking that header is rejected 401. It is a PRESENCE check only —
# Arbiter cannot verify Caddy set it, so it is sound only while Arbiter is
# unreachable except through the proxy. That is why the default bind is
# loopback (see --bind/--socket); a listener exposed on the tailnet lets any
# peer forge the header. Unset => /admin/* ungated (dev only).
#
# admin:
#   forward_auth_header: "X-Forwarded-User"

# Event store. Unset (the default) means no persistence: requests run exactly
# as before, nothing is recorded. Set `path` to enable a sqlite store holding
# one row per completed request — success, upstream failure, and streams alike,
# with tokens, cost, latency, routing rationale and classification axes.
#
# The writer is opened once at startup and shared across reloads, so this path
# is fixed for the process lifetime. Cost is computed from `model_catalog`
# rates whenever the upstream reports none (see the catalog section above).
#
# `capture_content` additionally stores prompt and response BODIES. They are
# content-addressed and deduplicated at message-block granularity, so a
# conversation that re-sends its earlier turns on every request stores each
# block once — which also makes "the text this client prepends to everything"
# a query (`/admin/content/repeated`) rather than a guess. Off by default: this
# is the one setting that writes conversation text to disk. Capture happens
# BEFORE pre-guardrails, so the client's own system prompt is what is stored,
# never the text Arbiter injects.
#
# `content_ttl` is how long captured bodies are kept (a Go duration — "72h",
# NOT "3d"). Empty or "0" means NEVER EXPIRE, deliberately: retention is
# opt-in, so an upgrade cannot silently start deleting data. Request metadata
# is not on this clock; it stays useful far longer than conversation text does.
# Binary/image blocks are recorded by hash only (no file is stored), so they
# still deduplicate without being kept.
#
# storage:
#   path: "arbiter.db"
#   capture_content: true
#   content_ttl: "72h"

guardrails:
  pre:
    - name: "system_prompt"
      type: "system_prompt"
      config:
        prompt: "You are a helpful assistant. Be direct and concise."
        override: false

    - name: "rate_limit"
      type: "rate_limit"
      config:
        per_minute: 100
        per_day: 10000

  post: []

# Session affinity: once a request is routed, the conversation is pinned to
# whichever provider/model actually served it, so later turns reuse the same
# upstream (prompt-cache friendly) instead of re-routing every turn. The
# session key is the header below when present, else a hash of the client's
# own system prompt + first user message. Both fields are optional; defaults
# shown. default_ttl is sized to a working session (an interactive pause, or
# an overnight gap) rather than to a cache window — a short idle timeout drops
# the pin whenever the user steps away, after which the next turn re-routes to
# a cold provider and pays full price. A provider may override it with its own
# cache_ttl.
#
# session_affinity:
#   header: "X-Session-Id"
#   default_ttl: "25h"

logging:
  level: "info"
  format: "json"
  output: "stdout"
