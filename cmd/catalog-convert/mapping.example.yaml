# Example mapping for catalog-convert: says which litellm_provider each
# Arbiter provider corresponds to. Copy next to your config and edit.
#
#   devenv shell -- go run ./cmd/catalog-convert \
#     -mapping cmd/catalog-convert/mapping.example.yaml \
#     -config lanes.yaml \
#     -out catalog.yaml \
#     model_prices_and_context_window.json
#
# There is no per-model list to maintain: every chat-mode entry LiteLLM files
# under a mapped litellm_provider becomes a catalog row. `-config lanes.yaml`
# limits generation to the providers it actually declares (skipping any
# mapping entry with no match there); omit -config and every provider listed
# below is used instead.
#
# `key_prefix` strips a namespacing prefix LiteLLM uses for some providers
# (e.g. "openrouter/anthropic/claude-3.5-sonnet") before the remainder becomes
# the catalog row's `model` — which is exactly the string you'd write under
# that provider's `models:` in lanes.yaml, so no further translation is
# needed. A litellm_provider entry whose key doesn't start with the configured
# prefix is reported on stderr rather than guessed at.
#
# Rows for models you haven't declared in lanes.yaml are simply unused — see
# README.md's "Group selection strategies" section for why that's fine.
#
# Latency is NOT in LiteLLM's price list. `latency_ms_p50` sets a per-provider
# default; the top-level `latency_ms_p50` map overrides it per "provider/model"
# (using the model name as it appears in the generated catalog, i.e. after
# key_prefix is stripped). Omit both and rows are written with latency 0 (the
# `fastest` strategy treats 0 as unknown and ranks such members last, so a
# real figure is worth supplying for anything you intend to select by speed).

providers:
  claude:
    litellm_provider: anthropic
    latency_ms_p50: 900

  gpt4:
    litellm_provider: openai
    latency_ms_p50: 1200

  litellm:
    litellm_provider: openrouter
    key_prefix: "openrouter/"
    latency_ms_p50: 2500

# Per-model latency overrides, keyed "provider/model" as Arbiter sees them.
latency_ms_p50:
  claude/claude-3-haiku-20250307: 750
