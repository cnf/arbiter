# Example mapping for catalog-convert: says which upstream files to read and
# which provider key each Arbiter provider's models are filed under.
# Copy next to your config and edit.
#
#   devenv shell -- go run ./cmd/catalog-convert \
#     -mapping mapping.yaml -config arbiter.yaml -out catalog.yaml
#
# ---------------------------------------------------------------------------
# sources: the upstream files, in PRECEDENCE ORDER.
# ---------------------------------------------------------------------------
#
# Each entry is either a bare path (kind sniffed from the file's content) or an
# object when you want to be explicit:
#
#   sources:
#     - litellm-prices.json
#     - {path: api.json, kind: modelsdev-api}
#
# Paths resolve relative to THIS file's directory, like model_catalog_file: in
# Arbiter's config — so a mapping sitting next to its downloads names them
# plainly. With a sources: list, no positional price list is expected.
#
# Kinds:
#   litellm           LiteLLM's model_prices_and_context_window.json
#                     (costs are per TOKEN; scaled to per-million here)
#   modelsdev-api     models.dev api.json — provider-nested, carries cost
#                     (costs are ALREADY per million tokens)
#   modelsdev-models  models.dev models.json — flat "<vendor>/<model>" keys,
#                     no cost, no provider dimension
#
# First source wins: a model already emitted is never overridden by a later
# source, and there is no per-field merge. `source:` on a provider entry pins
# it to one named source explicitly; leaving it unset searches sources: in
# order for the first one that actually has a matching row for that provider
# (using whichever provider key applies — see `provider:` below), so listing
# order is a pure precedence list and never a hidden default binding.
#
# The cost unit differs per kind and is handled by each reader. It is the one
# thing most worth getting right: models.dev figures run through the litellm
# conversion would be inflated a millionfold, silently.

sources:
  - litellm-prices.json        # first wins
  - models-dev-api.json
  - models-dev-models.json

# `-config arbiter.yaml` limits generation to the providers it actually
# declares (skipping any mapping entry with no match there); omit -config and
# every provider listed below is used instead.
#
# `key_prefix` strips a namespacing prefix the upstream puts on the key
# (e.g. "openrouter/anthropic/claude-3.5-sonnet") before the remainder becomes
# the catalog row's `model` — which is exactly the string you'd write under
# that provider's `models:` in arbiter.yaml, so no further translation is
# needed. A key that doesn't start with the configured prefix is reported on
# stderr rather than guessed at.
#
# `namespace` adds a prefix to the emitted model name. It is the other direction
# from key_prefix, and both are needed because providers differ in which side
# carries the namespace: one whose upstream keys are longer than its declared
# names wants key_prefix, while one whose upstream keys are bare but whose models
# are declared under a namespace (an omniroute-style prefixing proxy, or a
# self-hosted proxy fronting another vendor's API) wants namespace. Arbiter joins
# a row to a declared model on the exact string, so a missing namespace means the
# rows are emitted but never read — silently.
#
# Rows for models you haven't declared in arbiter.yaml are simply unused — see
# README.md's "Group selection strategies" section for why that's fine.
#
# `manual` lists declared models expected to have NO upstream data — your own
# presets, or models whose source isn't wired up yet. They are reported in the
# coverage summary but never count as failures, which is what keeps -strict
# meaningful: without this, a permanently-unmatchable model would fail every run
# and the gate would stop being read. Entries are the model string exactly as
# declared in arbiter.yaml.
#
# `-coverage text|json|none` reports, per provider, which declared models got a
# row and which did not. It requires `-config`, since that is what declares the
# models. Use `-coverage json -coverage-out report.json` for a cron: writing to
# its own file keeps the report pure JSON, with none of the log lines that share
# stderr.
#
# Latency is NOT in any of these sources. `latency_ms_p50` sets a per-provider
# default; the top-level `latency_ms_p50` map overrides it per "provider/model"
# (using the emitted name, i.e. after key_prefix and namespace — both spellings
# resolve, so a key written against the bare name keeps working if a namespace is
# added later). Omit both and rows are written with latency 0 (the `fastest`
# strategy treats 0 as unknown and ranks such members last, so a real figure is
# worth supplying for anything you intend to select by speed).

providers:
  claude:
    provider: anthropic          # matches both litellm_provider and
                                  # models_dev_provider — the common case,
                                  # since the two kinds usually agree on the
                                  # provider slug. Use litellm_provider: /
                                  # models_dev_provider: instead when a
                                  # provider's slug actually differs between
                                  # sources (either one, when set, wins over
                                  # provider: for that kind).
    namespace: "claude/"        # emit claude/claude-sonnet-5
    latency_ms_p50: 900

  gpt4:
    litellm_provider: openai
    latency_ms_p50: 1200

  litellm:
    litellm_provider: openrouter
    key_prefix: "openrouter/"
    latency_ms_p50: 2500

  opencode_zen:
    source: models-dev-api.json
    models_dev_provider: opencode

  omni:
    # An aggregator whose models are already named "<vendor>/<model>" — exactly
    # the flat file's key shape, so no prefix handling is needed or wanted, and
    # no provider key either: that file has no provider dimension.
    source: models-dev-models.json

# Per-model latency overrides, keyed "provider/model" as Arbiter sees them —
# i.e. the emitted name, including any namespace. Both spellings resolve, so a
# key written against the bare name keeps working if a namespace is added later.
latency_ms_p50:
  claude/claude-3-haiku-20250307: 750

# Declared models expected to have no upstream data. Reported, never fatal.
manual:
  - "openrouter/@preset/my-preset"   # your own preset: no upstream row exists
  - "opencode_zen/big-pickle"        # source not wired up yet
