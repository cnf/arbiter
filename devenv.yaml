# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
strict_ports: true
inputs:
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  go-overlay:
    url: github:purpleclay/go-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:NixOS/nixpkgs/nixpkgs-unstable
secretspec:
  enable: true
  # file:// rather than keyring: a container has no D-Bus session bus and no
  # /run/user, so the Secret Service keyring cannot exist, and devenv aborts
  # the whole shell ("Keyring error: No default store has been set") before it
  # evaluates anything. The file provider needs no daemon. Values live under
  # .secrets/ — gitignored, see .gitignore.
  provider: "file://./.secrets"   # keyring, dotenv, env, 1password, lastpass
  profile: default   # profile from secretspec.toml
