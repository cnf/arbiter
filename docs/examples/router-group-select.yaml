# Group alias selection strategies + the model_catalog that feeds the
# cost/latency ones.
#
# A `group` alias's `select:` decides which member becomes the primary (the
# rest become its fallback chain):
#
#   random            (default) a random member
#   cheapest_input    lowest input_cost_per_mtok
#   cheapest_output   lowest output_cost_per_mtok
#   fastest           lowest latency_ms_p50
#
# The cost/latency strategies read `model_catalog` — static figures, keyed by
# provider+model, in USD per million tokens and milliseconds. A member with
# no catalog entry is "unknown cost" and ranks last rather than erroring; if
# NO member has an entry (or no catalog is configured at all), selection
# falls back to the first-listed member, deterministically.
#
# The catalog can also come from a generated file via `model_catalog_file:`
# (see cmd/catalog-convert) — an inline row for the same provider/model wins
# over the file's row entirely (no field-by-field merge, since 0 is a
# meaningful cost and could not otherwise be told from "unset").
#
# A row also carries what the model CAN DO (`input_modalities`,
# `max_input_tokens`, `max_output_tokens`, `metadata`), which `/v1/models`
# advertises and a policy rule can route on via `requires_input_modalities`
# (see docs/examples/router-policy-rules.yaml).
#
# Load this file directly to see it work:
#   go run ./cmd/arbiter --config docs/examples/router-group-select.yaml

version: "1.0"

providers:
  claude:
    type: "anthropic"
    endpoint: "https://api.anthropic.com"
    key: "${ANTHROPIC_API_KEY}"
    models: ["claude-3-haiku-20250307"]
  litellm:
    type: "openai"
    endpoint: "${LITELLM_URL}"
    key: "${LITELLM_API_KEY}"
    models: ["openrouter/free"]
  local:
    type: "ollama"
    endpoint: "http://localhost:11434/v1"
    models: ["llama2"]

aliases:
  free-search:
    type: "group"
    select: "cheapest_input"           # random | cheapest_input | cheapest_output | fastest
    members:
      - { provider: "litellm", model: "openrouter/free" }
      - { provider: "claude", model: "claude-3-haiku-20250307" }
      - { provider: "local", model: "llama2" }   # no catalog row: ranks last, never errors

model_catalog:                         # hand-managed; wins on conflict with model_catalog_file
  - provider: "litellm"
    model: "openrouter/free"
    input_cost_per_mtok: 0
    output_cost_per_mtok: 0
    latency_ms_p50: 2500
  - provider: "claude"
    model: "claude-3-haiku-20250307"
    input_cost_per_mtok: 0.25
    output_cost_per_mtok: 1.25
    latency_ms_p50: 900
    input_modalities: ["text", "image"]   # what the model accepts
    max_input_tokens: 200000
    metadata:                             # free-form, forwarded to /v1/models
      function_calling: true

# model_catalog_file: "catalog.yaml"     # generated; supplies defaults for rows not listed above

routers:
  - name: "primary"
    type: "simple"
    config:
      default_provider: "claude"
