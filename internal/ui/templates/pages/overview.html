{{define "content"}}
<h1>Overview</h1>
<p class="lede">Where the requests, money and time went, over a window. Pick a
dimension to group by and a metric to rank by; every row carries every metric, so
the numbers behind a ranking stay visible while you look at it.</p>

<form class="filters" hx-get="/admin/ui/overview" hx-target="#pivot-table"
      hx-swap="outerHTML" hx-push-url="true" hx-indicator="#busy">
  <label>window
    <input type="text" name="since" value="{{.SinceRaw}}" size="6" placeholder="168h">
  </label>
  <label>group by
    <select name="dim">
      {{$dim := .Dimension}}{{range .Dimensions}}
      <option value="{{.}}"{{if eq . $dim}} selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>
  <label>rank by
    <select name="metric">
      {{$m := .Metric}}{{range .Metrics}}
      <option value="{{.}}"{{if eq . $m}} selected{{end}}>{{.}}</option>
      {{end}}
    </select>
  </label>
  <button type="submit">apply</button>
  <a class="reset" href="/admin/ui/overview">reset</a>
  <span id="busy" class="htmx-indicator">…</span>
</form>

{{template "pivot-table" .}}
{{end}}
