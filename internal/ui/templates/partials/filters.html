{{/* filters.html is the request-list filter form. It is an ordinary form with
htmx attached: hx-get swaps only the rows, hx-push-url keeps the address bar
honest, so a filter state can be reloaded, shared or bookmarked. */}}
{{define "filters"}}
<form class="filters" hx-get="/admin/ui/requests" hx-target="#rows" hx-swap="outerHTML"
      hx-push-url="true" hx-indicator="#busy">
  <label>since
    <input type="text" name="since" value="{{.F.SinceRaw}}" size="6" placeholder="24h">
  </label>
  <label>provider
    <input type="text" name="provider" value="{{.F.Provider}}" size="10">
  </label>
  <label>alias
    <input type="text" name="alias" value="{{.F.Alias}}" size="10">
  </label>
  <label>status
    <input type="text" name="status" value="{{.F.StatusRaw}}" size="4" placeholder="any">
  </label>
  <label>session
    <input type="text" name="session" value="{{.F.SessionKey}}" size="10">
  </label>
  {{if .F.SessionKeyless}}<input type="hidden" name="no_session" value="1">{{end}}
  <label class="check"><input type="checkbox" name="errors" value="1"{{if .F.ErrorsOnly}} checked{{end}}> errors only</label>
  <label>limit
    <input type="text" name="limit" value="{{.F.LimitRaw}}" size="4" placeholder="500">
  </label>
  <button type="submit">filter</button>
  <a class="reset" href="/admin/ui/requests">reset</a>
  <span id="busy" class="htmx-indicator">…</span>
</form>
{{end}}
