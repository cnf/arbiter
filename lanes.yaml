version: "1.0"

providers:
  litellm:
    type: "openai"
    endpoint: "${LITELLM_URL}"
    key: "${LITELLM_API_KEY}"
    models: ["openrouter/free"]

  claude:
    type: "anthropic"
    endpoint: "https://api.anthropic.com"
    key: "${ANTHROPIC_API_KEY}"
    models:
      - "claude-3-opus-20250219"
      - "claude-3-sonnet-20250219"
      - "claude-3-haiku-20250307"

  gpt4:
    type: "openai"
    endpoint: "https://api.openai.com/v1"
    key: "${OPENAI_API_KEY}"
    models:
      - "gpt-4-turbo"
      - "gpt-4o"

  local:
    # Ollama exposes an OpenAI-compatible /v1 endpoint. "ollama" selects
    # that OpenAI-compatible transport while preserving provider identity.
    type: "ollama"
    endpoint: "http://localhost:11434/v1"
    models:
      - "llama2"

classifiers:
  - name: "domain"
    type: "heuristic"
    config:
      keywords:
        code_generation:
          - "write"
          - "generate"
          - "refactor"
          - "implement"
        reasoning:
          - "explain"
          - "analyze"
          - "debug"
          - "understand"
        chat:
          - "hello"
          - "hi"
          - "hey"
        discovery:
          - "what is"
          - "how does"
          - "when did"

  - name: "capability"
    type: "capability_detector"
    config:
      detectors:
        vision:
          - "image"
          - "screenshot"
          - "visual"
        tool_use:
          - "tool"
          - "function"
          - "action"

routers:
  - name: "primary"
    type: "simple"
    config:
      default_provider: "claude"
#  - name: "primary"
#    type: "simple"
#    config:
#      default_provider: "claude"
#      fallback_provider: "gpt4"

guardrails:
  pre:
    - name: "system_prompt"
      type: "system_prompt"
      config:
        prompt: "You are a helpful assistant. Be direct and concise."
        override: false

    - name: "rate_limit"
      type: "rate_limit"
      config:
        per_minute: 100
        per_day: 10000

  post: []

logging:
  level: "info"
  format: "json"
  output: "stdout"
